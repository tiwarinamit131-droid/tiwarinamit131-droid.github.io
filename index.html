<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Namit Tiwari, B.Tech Computer Science at South Asian University. Interactive retro-terminal portfolio.">
<meta property="og:title" content="Namit Tiwari · NamitOS">
<meta property="og:description" content="B.Tech CSE at South Asian University. Type help to start.">
<meta name="theme-color" content="#15110d">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231b1206'/%3E%3Ctext x='5' y='22' font-family='monospace' font-size='16' fill='%23ffb547'%3E%3E_%3C/text%3E%3C/svg%3E">
<title>namit@sau Terminal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Mono:wght@400;600&family=Caveat:wght@500;700&display=swap">
<style>
/* Layout: a late-night desk. A beige CRT running "NamitOS" sits on a wooden desk; the keyboard and a few
   everyday objects share the desk. Every object is quietly clickable, and most of them are secrets. */
:root {
  --wall: #15110d;        /* room at night */
  --wall-line: #1d1813;
  --wood: #5a3b22;        /* desk */
  --wood-dark: #3b2614;
  --plastic: #d9cfbb;     /* 1990s beige monitor */
  --plastic-dark: #b3a789;
  --crt: #1b1206;         /* tube glass */
  --amber: #ffb547;       /* phosphor, swapped by the knob */
  --dim: #b07a2a;
  --hot: #fff1c9;
  --alert: #ff6b4a;
  --ok: #9be37a;
  --note: #ffe873;
  --display: "VT323", "IBM Plex Mono", monospace;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --hand: "Caveat", "Comic Sans MS", cursive;
  color-scheme: dark;
}
:root[data-phosphor="green"] { --amber: #7dff8a; --dim: #3f9a4a; --hot: #e2ffe5; --crt: #07140a; --ok: #c6ff7a; }
:root[data-phosphor="ice"] { --amber: #8fd8ff; --dim: #4b7fa3; --hot: #eaf7ff; --crt: #071018; --ok: #a5f0d4; }
:root[data-phosphor="saffron"] { --amber: #ff9933; --dim: #b8621f; --hot: #ffe2b8; --crt: #1d0c03; --ok: #ffd04d; --alert: #ff4f3a; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--wall); color: var(--amber); font-family: var(--mono); font-size: 15px; line-height: 1.5; }
:focus-visible { outline: 2px solid var(--note); outline-offset: 3px; }
.room { min-height: 100vh; display: flex; flex-direction: column; background:
  radial-gradient(ellipse 60% 45% at 50% 30%, color-mix(in srgb, var(--amber) 10%, transparent), transparent 70%),
  repeating-linear-gradient(90deg, var(--wall) 0 46px, var(--wall-line) 46px 48px); padding-top: 22px; }
.stage { width: 100%; box-sizing: border-box; max-width: 1180px; margin: 0 auto; padding-inline: 16px; }

/* ---------- monitor ---------- */
.monitor { max-width: 900px; margin: 0 auto; position: relative; }
.bezel { position: relative; background: linear-gradient(180deg, var(--plastic), var(--plastic-dark)); border-radius: 26px 26px 18px 18px; padding: 22px 26px 12px;
  box-shadow: 0 30px 60px rgb(0 0 0 / .55), inset 0 2px 0 rgb(255 255 255 / .5), inset 0 -4px 0 rgb(0 0 0 / .15); }
.glass { position: relative; background: #050403; border-radius: 16px; padding: 6px; box-shadow: inset 0 0 0 3px #8f846c, inset 0 6px 14px rgb(0 0 0 / .8); }
.tube { position: relative; border-radius: 12px; overflow: hidden; background: radial-gradient(ellipse at center, color-mix(in srgb, var(--amber) 9%, var(--crt)), var(--crt) 70%);
  animation: poweron .7s ease-out both; transform-origin: center; }
@keyframes poweron { 0% { transform: scaleY(.004) scaleX(.6); filter: brightness(4); } 45% { transform: scaleY(.004) scaleX(1); } 100% { transform: none; filter: none; } }
@keyframes poweroff { 0% { transform: none; } 55% { transform: scaleY(.004); filter: brightness(3); } 100% { transform: scaleY(.004) scaleX(0); filter: brightness(0); } }
@keyframes degauss { 0% { filter: none; } 12% { transform: skewX(5deg) scale(1.03); filter: hue-rotate(90deg) saturate(2.5) blur(.6px); } 30% { transform: skewX(-4deg) scale(.99); filter: hue-rotate(210deg) saturate(2); }
  52% { transform: skewX(2deg); filter: hue-rotate(310deg); } 76% { transform: skewX(-1deg); filter: hue-rotate(30deg); } 100% { transform: none; filter: none; } }
.tube.off { animation: poweroff .45s ease-in forwards; }
.tube.degauss { animation: degauss .9s ease-out; }
.osbar { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 6px 14px; font-size: 12px; background: color-mix(in srgb, var(--amber) 14%, var(--crt));
  border-bottom: 1px solid color-mix(in srgb, var(--amber) 30%, transparent); color: var(--hot); flex-wrap: wrap; }
.osbar .r { display: flex; gap: 14px; align-items: center; }
.batt { all: unset; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.batt .cell { width: 26px; height: 11px; border: 1px solid var(--hot); position: relative; padding: 1px; }
.batt .cell::after { content: ""; position: absolute; right: -4px; top: 3px; width: 2px; height: 4px; background: var(--hot); }
.batt .lvl { display: block; height: 100%; background: var(--amber); transition: width .4s; }
.found { color: var(--ok); }
.screen { position: relative; padding: 16px 18px 14px; height: clamp(300px, calc(100vh - 420px), 640px); overflow-y: auto; scrollbar-color: var(--dim) transparent;
  text-shadow: 0 0 6px color-mix(in srgb, var(--amber) 55%, transparent); cursor: text; }
.scan { pointer-events: none; position: absolute; inset: 0; z-index: 2;
  background: repeating-linear-gradient(0deg, rgb(0 0 0 / .2) 0 1px, transparent 1px 3px), radial-gradient(ellipse at center, transparent 60%, rgb(0 0 0 / .45)); animation: flick 5s infinite steps(1); }
@keyframes flick { 0%, 97% { opacity: 1; } 98% { opacity: .82; } }

/* bezel furniture */
.controls { display: flex; align-items: center; gap: 14px; padding: 12px 6px 2px 34px; color: #6d6450; font-size: 10px; letter-spacing: .18em; text-transform: uppercase; flex-wrap: wrap; }
.controls .model { font-weight: 600; margin-right: auto; }
.ctl { all: unset; cursor: pointer; font: 600 9px var(--mono); letter-spacing: .14em; color: #5d5544; padding: 5px 9px; border-radius: 4px; background: linear-gradient(180deg, #e8dfcb, #c2b697);
  box-shadow: 0 2px 0 #8f846c, inset 0 1px 0 #fff; display: inline-flex; gap: 6px; align-items: center; }
.ctl:active { transform: translateY(2px); box-shadow: 0 0 0 #8f846c; }
.ctl .dot { width: 6px; height: 6px; border-radius: 50%; background: #6d6450; }
.ctl[aria-pressed="true"] .dot { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
.knob { all: unset; cursor: pointer; width: 26px; height: 26px; border-radius: 50%; background: conic-gradient(from 0deg, #9d927a, #e6dcc6, #9d927a, #e6dcc6, #9d927a);
  box-shadow: 0 2px 3px rgb(0 0 0 / .4), inset 0 0 0 3px #b3a789; position: relative; transform: rotate(var(--rot, 0deg)); transition: transform .3s cubic-bezier(.3,1.6,.5,1); }
.knob::after { content: ""; position: absolute; left: 50%; top: 3px; width: 2px; height: 8px; margin-left: -1px; background: #4a4335; }
.pwr { all: unset; cursor: pointer; width: 22px; height: 22px; border-radius: 50%; background: linear-gradient(180deg, #efe7d5, #bfb393); box-shadow: 0 2px 0 #8f846c; display: grid; place-items: center; }
.pwr::before { content: "⏻"; font-size: 12px; color: #5d5544; }
.pwr:active { transform: translateY(2px); box-shadow: none; }
.led { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); display: inline-block; }
.led.off { background: #5d3a2a; box-shadow: none; }
.stand { width: 34%; height: 34px; margin: 0 auto; background: linear-gradient(180deg, var(--plastic-dark), #8f846c); clip-path: polygon(18% 0, 82% 0, 100% 100%, 0 100%); }

/* sticky note and sticker on the bezel */
.sticky { position: absolute; z-index: 4; right: -112px; top: 70px; width: 132px; padding: 10px 10px 12px; background: var(--note); color: #3b3218; font: 600 17px/1.15 var(--hand);
  transform: rotate(4deg); box-shadow: 0 8px 14px rgb(0 0 0 / .35); clip-path: polygon(0 0, 100% 0, 100% 88%, 88% 100%, 0 100%); }
.sticky b { display: block; font-size: 20px; }
.sticky button { all: unset; cursor: pointer; text-decoration: underline; text-decoration-thickness: 2px; }
.sticker { all: unset; cursor: pointer; position: absolute; left: 12px; bottom: 10px; width: 20px; height: 20px; border-radius: 50%; background: #ff9933; opacity: .85;
  box-shadow: inset 0 0 0 2px rgb(255 255 255 / .5); display: grid; place-items: center; }
.sticker svg { width: 12px; height: 12px; }

/* ---------- desk ---------- */
.desk { flex: 1; position: relative; margin-top: -2px; padding: 22px 16px 26px; background:
  linear-gradient(180deg, #7a5233 0, var(--wood) 10px, var(--wood-dark) 100%),
  repeating-linear-gradient(178deg, transparent 0 18px, rgb(0 0 0 / .06) 18px 20px); background-blend-mode: multiply; box-shadow: inset 0 3px 0 #94673f; }
.deskgrid { max-width: 1320px; margin: 0 auto; display: grid; grid-template-columns: 1fr minmax(0, 820px) 1fr; gap: 22px; align-items: end; }
.cluster { display: flex; gap: 12px 14px; align-items: flex-end; flex-wrap: wrap; min-width: 0; }
.cluster.left { justify-content: flex-end; }
.obj { all: unset; cursor: pointer; position: relative; display: block; filter: drop-shadow(0 8px 6px rgb(0 0 0 / .45)); transition: transform .15s; }
.obj:hover { transform: translateY(-3px) rotate(-2deg); }
.obj:focus-visible { outline: 2px solid var(--note); outline-offset: 4px; border-radius: 6px; }
.obj svg { display: block; }
.mug svg { width: 66px; height: 66px; }
.steam { position: absolute; left: 22px; top: -18px; width: 24px; height: 26px; pointer-events: none; }
.steam i { position: absolute; bottom: 0; width: 5px; height: 18px; border-radius: 50%; border-left: 2px solid rgb(255 255 255 / .35); animation: steam 2.4s ease-in-out infinite; }
.steam i:nth-child(2) { left: 9px; animation-delay: .8s; }
.steam i:nth-child(3) { left: 17px; animation-delay: 1.6s; }
@keyframes steam { 0% { transform: translateY(6px) scaleY(.6); opacity: 0; } 40% { opacity: 1; } 100% { transform: translateY(-14px) scaleY(1.2) skewX(12deg); opacity: 0; } }
.polaroid { width: 58px; height: 66px; background: #f2eee6; transform: rotate(-9deg); border-radius: 2px; display: grid; place-items: end center; padding-bottom: 6px;
  font: 700 15px var(--hand); color: #8a8274; box-shadow: inset 0 0 0 1px #d8d2c5; }
.polaroid:hover { transform: translateY(-3px) rotate(-12deg); }
.paper { width: 50px; height: 40px; background: #ece6d6; transform: rotate(7deg); display: grid; place-items: center; font-size: 13px; color: #c0473f; border-radius: 1px;
  background-image: linear-gradient(90deg, transparent 49%, rgb(0 0 0 / .08) 50%, transparent 51%); }
.phones svg { width: 76px; height: 58px; }
.shuttle svg { width: 52px; height: 52px; transform: rotate(-60deg); }
.dumbbell svg { width: 86px; height: 34px; }
.compass svg { width: 46px; height: 46px; }
.compass .needle { transform-origin: 24px 24px; animation: wobble 4s ease-in-out infinite; }
@keyframes wobble { 0%, 100% { transform: rotate(-25deg); } 30% { transform: rotate(40deg); } 60% { transform: rotate(-10deg); } 80% { transform: rotate(70deg); } }

.keyboard { background: linear-gradient(180deg, #2b2620, #1c1814); border-radius: 12px; padding: 12px; box-shadow: 0 14px 20px rgb(0 0 0 / .5), inset 0 1px 0 rgb(255 255 255 / .08); position: relative; }
.keys { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.keys button { font: 600 12px var(--mono); color: #2b2015; background: linear-gradient(180deg, #efe4cf, #cbbd9f); border: 0; border-radius: 6px; padding: 7px 9px 10px; cursor: pointer;
  box-shadow: inset 0 -4px 0 #a8987a, 0 2px 0 #000; }
.keys button:active { transform: translateY(2px); box-shadow: inset 0 -2px 0 #a8987a, 0 0 0 #000; }
.paw { all: unset; cursor: pointer; position: absolute; right: 10px; bottom: -9px; width: 18px; height: 18px; opacity: .55; }
.paw:hover { opacity: 1; }
.hint { text-align: center; font-size: 12px; color: #c9a77f; margin-top: 12px; }

/* terminal text */
.line { white-space: pre-wrap; word-break: break-word; }
.dim { color: var(--dim); }
.hot { color: var(--hot); }
.ok { color: var(--ok); }
.alert { color: var(--alert); }
.prompt { color: var(--ok); }
.cmdlink { all: unset; cursor: pointer; color: var(--hot); text-decoration: underline dotted; text-underline-offset: 3px; }
.cmdlink:hover, .cmdlink:focus-visible { background: var(--amber); color: var(--crt); text-shadow: none; }
.row { display: flex; gap: 8px; align-items: baseline; }
.row input { flex: 1; min-width: 0; background: transparent; border: 0; color: var(--hot); font: inherit; caret-color: var(--amber); text-shadow: inherit; padding: 0; }
.row input:focus { outline: none; }
.bar { display: inline-block; height: 10px; background: var(--amber); box-shadow: 0 0 8px var(--amber); vertical-align: middle; }
.fetch { display: grid; grid-template-columns: auto 1fr; gap: 26px; align-items: start; margin: 6px 0 4px; }
.fetch pre, pre.art { margin: 0; font-family: var(--mono); line-height: 1.2; }
.fetch dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 1px 12px; min-width: 0; }
.fetch dt { color: var(--hot); font-weight: 600; }
.fetch dd { margin: 0; min-width: 0; }
.swatch { display: flex; margin-top: 6px; }
.swatch i { width: 22px; height: 14px; display: block; }
pre.figlet { margin: 4px 0 6px; font-family: var(--mono); font-size: clamp(7px, 2.1vw, 15px); line-height: 1.15; color: var(--hot); text-shadow: 0 0 8px var(--hot); overflow: hidden; }
.big { font-family: var(--display); font-size: clamp(38px, 8vw, 72px); line-height: .85; color: var(--hot); letter-spacing: .03em; }
table { border-collapse: collapse; }
td, th { padding: 1px 14px 1px 0; vertical-align: top; text-align: left; font-weight: 400; }
th { color: var(--crt); background: var(--amber); text-shadow: none; padding: 0 10px 0 4px; }
.toast { position: absolute; right: 40px; top: 58px; z-index: 5; background: var(--crt); color: var(--ok); border: 1px solid var(--ok); padding: 6px 10px; font-size: 12px;
  box-shadow: 0 0 14px color-mix(in srgb, var(--ok) 40%, transparent); }
.v01 canvas { width: min(240px, 100%); height: auto; aspect-ratio: 3 / 4; max-width: 100%; display: block; margin: 6px 0; border: 1px solid var(--dim); image-rendering: pixelated; cursor: pointer; box-shadow: 0 0 18px color-mix(in srgb, var(--amber) 30%, transparent); }
.matrix { position: fixed; inset: 0; pointer-events: none; z-index: 5; }

.nosig { position: absolute; inset: 6px; z-index: 3; border-radius: 12px; background: #020203; display: grid; place-content: center; text-align: center; gap: 10px;
  color: #c8d0ff; font: 30px/1.1 var(--display); letter-spacing: .06em; cursor: pointer; }
.nosig small { display: block; font-size: 20px; color: #7f88b8; animation: blink 1.4s steps(1) infinite; }
@keyframes blink { 60% { opacity: .15; } }
.notes { display: block; max-width: 540px; margin: 8px 0; padding: 14px 18px 16px 34px; color: #263a78; text-shadow: none; font: 600 21px/30px var(--hand); white-space: pre-line;
  background: linear-gradient(90deg, transparent 22px, #e59a9a 22px 24px, transparent 24px), repeating-linear-gradient(180deg, #f6efda 0 29px, #b8c7e6 29px 30px); transform: rotate(-.6deg);
  box-shadow: 0 6px 14px rgb(0 0 0 / .4); }
.notes b { font-size: 26px; }
.md h1, .md h2 { display: inline; margin: 0; font: inherit; color: var(--hot); }
.md h1 { font-family: var(--display); font-size: 30px; line-height: 1.1; }
.notebook { width: 46px; height: 58px; background: #2c4a7a; border-radius: 3px 5px 5px 3px; transform: rotate(-6deg); box-shadow: inset 6px 0 0 #1d3256;
  display: grid; place-items: center; font: 700 13px var(--hand); color: #e8dfc8; }
.notebook::after { content: ""; position: absolute; left: 2px; top: 6px; bottom: 6px; width: 3px; background: repeating-linear-gradient(180deg, #c9c1ad 0 3px, transparent 3px 7px); }
.phone { width: 30px; height: 54px; background: #1a1a1f; border-radius: 6px; padding: 4px 3px 8px; transform: rotate(8deg); }
.phone i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(160deg, #2a3f6a, #101624); box-shadow: inset 0 0 6px #4b7fd1; }
.trash svg { width: 40px; height: 48px; }
.clock { padding: 5px 7px; background: #141010; border-radius: 6px; border: 2px solid #3a2f26; font: 22px/1 var(--display); color: #ff4a3a; text-shadow: 0 0 6px #ff4a3a; letter-spacing: .05em; }
.clock.night { color: #a8352c; text-shadow: 0 0 3px #a8352c; }
.trophy svg { width: 30px; height: 36px; }
.sticky.on-desk { position: relative; right: auto; top: auto; display: none; width: 100px; padding: 7px 8px 9px; font-size: 13px; transform: rotate(-4deg); }
@media (max-width: 1240px) { .bezel .sticky { display: none; } .sticky.on-desk { display: block; } }
@media (max-width: 1100px) {
  .deskgrid { grid-template-columns: 1fr; }
  .cluster, .cluster.left { justify-content: center; }
  .keyboard { order: -1; }
}
@media (max-width: 600px) { .sticky.on-desk { display: none; } }
@media (max-width: 600px) {
  .bezel { padding: 12px 10px 8px; border-radius: 16px; }
  .screen { padding: 12px; font-size: 13px; height: 64vh; }
  .fetch { grid-template-columns: 1fr; gap: 8px; }
  .fetch pre { font-size: 11px; }
  .osbar .hide-s { display: none; }
  .controls { gap: 10px; }
  .controls .model { display: none; }
}
@media (prefers-reduced-motion: reduce) { .tube, .scan, .steam i, .compass .needle { animation: none !important; } }
</style>

</head>
<body>
<div class="room">
  <div class="stage">
    <div class="monitor">
      <div class="bezel">
        <div class="glass">
          <div class="tube" id="tube">
            <div class="osbar">
              <span>NamitOS 1.0 <span class="dim hide-s">· tty1</span></span>
              <span class="r">
                <span class="found" id="found" hidden></span>
                <span id="clock"></span>
                <button class="batt" id="batt" type="button" aria-label="Battery"><span class="cell"><i class="lvl" id="lvl" style="width:92%"></i></span><span id="pct">92%</span></button>
              </span>
            </div>
            <div class="screen" id="screen" aria-live="polite">
              <div id="out"></div>
              <form class="row" id="form" autocomplete="off">
                <span class="prompt" id="ps1">namit@sau:~$</span>
                <input id="cmd" name="cmd" aria-label="Type a command" spellcheck="false" autocapitalize="off">
              </form>
            </div>
            <div class="scan" aria-hidden="true"></div>
          </div>
          <div class="nosig" id="nosig" hidden>No signal.<small>Press any key to restart.</small></div>
        </div>
        <div class="controls">
          <span class="model">NT-2029 · 14" colour</span>
          <button class="ctl" id="snd" type="button" aria-pressed="false"><i class="dot"></i>Sound</button>
          <button class="ctl" id="degauss" type="button">Degauss</button>
          <button class="knob" id="knob" type="button" aria-label="Phosphor colour knob"></button>
          <button class="pwr" id="power" type="button" aria-label="Power"></button>
          <i class="led" id="led"></i>
        </div>
        <button class="sticker" type="button" data-run="cat .gada" aria-label="Sticker"><svg viewBox="0 0 12 12"><circle cx="6" cy="3.6" r="2.6" fill="#fff"/><rect x="5.3" y="5.6" width="1.4" height="5.6" fill="#fff"/></svg></button>
        <div class="sticky"><b>TODO</b>☑ ship BACHAT<br>☐ win SIH 2026<br>☐ learn Qiskit<br>☐ get <button type="button" data-run="./get-hired">hired</button></div>
        <div class="toast" id="toast" hidden></div>
      </div>
      <div class="stand"></div>
    </div>
  </div>

  <div class="desk">
    <div class="deskgrid">
      <div class="cluster left">
        <div class="sticky on-desk"><b>TODO</b>☑ ship BACHAT<br>☐ win SIH 2026<br>☐ learn Qiskit<br>☐ get <button type="button" data-run="./get-hired">hired</button></div>
        <button class="obj polaroid" type="button" data-run="git checkout v0.1" aria-label="A photo, face down">v0.1</button>
        <button class="obj paper" type="button" data-run="cat .heart" aria-label="A folded note">♡</button>
        <button class="obj notebook" type="button" data-run="cat notes.md" aria-label="Notebook">notes</button>
        <button class="obj phone" type="button" data-run="phone" aria-label="Phone"><i></i></button>
        <button class="obj mug" type="button" data-run="cat .coffee" aria-label="Black coffee">
          <span class="steam" aria-hidden="true"><i></i><i></i><i></i></span>
          <svg viewBox="0 0 64 64"><path d="M44 28h5a7 7 0 0 1 0 14h-5" fill="none" stroke="#2b2724" stroke-width="5"/><path d="M12 22h33v26a9 9 0 0 1-9 9H21a9 9 0 0 1-9-9z" fill="#2b2724"/><ellipse cx="28.5" cy="22" rx="16.5" ry="4" fill="#120904"/><text x="28.5" y="44" font-size="10" text-anchor="middle" fill="#ffb547" font-family="monospace">&lt;/&gt;</text></svg>
        </button>
      </div>
      <div class="keyboard">
        <div class="keys" id="keys"></div>

/* ---------- v0.1: the childhood photo, decoded like an old modem download ---------- */
const hex = v => { const h = getComputedStyle(document.documentElement).getPropertyValue(v).trim().replace("#", ""); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); };
async function origin() {
  unlock("origin");
  print(`<span class="dim">$ git checkout v0.1</span>
Note: switching to 'v0.1'. You are in 'detached HEAD' state.
HEAD is now at 0000001 initial commit: "hello world"
<span class="dim">decoding /dev/memories/v0.1.jpg over a 56k modem ...</span>`);
  const box = print(""); box.classList.add("v01");
  const cv = document.createElement("canvas"); cv.width = 360; cv.height = 480; cv.title = "Click to toggle colour"; box.appendChild(cv);
  const img = new Image(); img.src = V01; await img.decode();
  const ctx = cv.getContext("2d"), small = document.createElement("canvas"), sx = small.getContext("2d");
  let colour = false, block = 40;
  function paint() {
    const w = Math.ceil(360 / block), h = Math.ceil(480 / block);
    small.width = w; small.height = h; sx.drawImage(img, 0, 0, w, h);
    ctx.imageSmoothingEnabled = false; ctx.clearRect(0, 0, 360, 480); ctx.drawImage(small, 0, 0, w, h, 0, 0, 360, 480);
    if (colour) return;
    const lo = hex("--crt"), mid = hex("--amber"), hiC = hex("--hot");
    const d = ctx.getImageData(0, 0, 360, 480), p = d.data;
    for (let i = 0; i < p.length; i += 4) {
      let t = (0.3 * p[i] + 0.59 * p[i + 1] + 0.11 * p[i + 2]) / 255;
      t = Math.min(1, Math.max(0, (t - 0.12) * 1.25));
      const [a, b, u] = t < 0.55 ? [lo, mid, t / 0.55] : [mid, hiC, (t - 0.55) / 0.45];
      for (let k = 0; k < 3; k++) p[i + k] = a[k] + (b[k] - a[k]) * u;
    }
    ctx.putImageData(d, 0, 0);
  }
  for (const b of [40, 24, 16, 10, 6, 4, 2, 1]) { block = b; paint(); await wait(240); }
  cv.addEventListener("click", () => { colour = !colour; paint(); });
  print(`<span class="hot">namit v0.1-alpha</span> <span class="dim">· early build · click the photo for true colour</span>
First recorded contact with vanaras: two monkeys, zero bugs. 🐒🐒
That explains a lot about the Hanuman thing.

<span class="hot">CHANGELOG</span>
  v0.1   plays with monkeys, wears very stripey sweaters
  v0.5   discovers computers, coffee and Bloodywood
  v1.0   hunts threats in one-way IP traffic <span class="dim">(current)</span>
<span class="dim">return to the present:</span> ${link("git checkout main")}`);
}

/* konami code: the driving force */
const KON = ["ArrowUp", "ArrowUp", "ArrowDown", "ArrowDown", "ArrowLeft", "ArrowRight", "ArrowLeft", "ArrowRight", "b", "a"]; let kp = 0;
addEventListener("keydown", e => { kp = e.key === KON[kp] ? kp + 1 : e.key === KON[0] ? 1 : 0; if (kp === KON.length) { kp = 0; cheat(); } });
async function cheat() {
  input.value = "";
  print(`<span class="big" style="font-size:40px">CHEAT CODE ACTIVATED</span>
<span class="ok">Achievement unlocked:</span> <span class="hot">You actually tried everything.</span>`);
  store.set("nt-cheat", true); $("trophy").hidden = false;
  await wait(1100);
  COMMANDS["cat .gada"]();
}
if (store.get("nt-cheat", false)) $("trophy").hidden = false;

function runMatrix() {
  const cv = $("matrix");
  if (reduce) { print("matrix skipped: reduced motion is on."); return; }
  cv.hidden = false; const ctx = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  const cols = Math.floor(cv.width / 16), drops = Array(cols).fill(0).map(() => Math.random() * -40);
  const chars = "NAMITTIWARI01アイウエオカキクケコ";
  const col = getComputedStyle(document.documentElement).getPropertyValue("--amber");
  let f = 0;
  const t = setInterval(() => {
    ctx.fillStyle = "rgba(18,12,5,.12)"; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.fillStyle = col; ctx.font = "16px VT323, monospace";
    drops.forEach((y, i) => { ctx.fillText(chars[Math.floor(Math.random() * chars.length)], i * 16, y * 16); drops[i] = y * 16 > cv.height && Math.random() > .97 ? 0 : y + 1; });
    if (++f > 160) { clearInterval(t); cv.hidden = true; print("Wake up, recruiter. " + link("contact")); }
  }, 33);
}

/* ---------- the desk: objects, knobs and sound ---------- */
let ac = null, sound = false;
function tone(kind) {
  if (!sound) return;
  try {
    ac = ac || new AudioContext();
    if (kind === "click") {
      const len = 900, b = ac.createBuffer(1, len, ac.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 7);
      const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
      s.buffer = b; f.type = "bandpass"; f.frequency.value = 2400 + Math.random() * 900; g.gain.value = .5;
      s.connect(f).connect(g).connect(ac.destination); s.start();
    } else {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = "sawtooth"; o.frequency.setValueAtTime(kind === "thunk" ? 70 : 15000, ac.currentTime);
      if (kind === "thunk") o.frequency.exponentialRampToValueAtTime(30, ac.currentTime + .6);
      g.gain.setValueAtTime(kind === "thunk" ? .35 : .04, ac.currentTime); g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + (kind === "thunk" ? .7 : .5));
      o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + .8);
    }
  } catch {}
}
input.addEventListener("keydown", e => { if (e.key.length === 1 || e.key === "Enter" || e.key === "Backspace") tone("click"); });
$("snd").addEventListener("click", e => { sound = !sound; e.currentTarget.setAttribute("aria-pressed", sound); if (sound) tone("whine"); });

const tube = $("tube");
function replay(cls) { tube.classList.remove("degauss", "off"); tube.style.animation = "none"; void tube.offsetWidth; tube.style.animation = ""; if (cls) tube.classList.add(cls); }
$("degauss").addEventListener("click", () => { if (tube.classList.contains("off")) return; replay("degauss"); tone("thunk"); });
let powered = true, pstate = "on";
async function shutdown() {
  if (pstate !== "on" || busy) return;
  pstate = "shutting"; busy = true; input.disabled = true; pending = null;
  print("Saving session...");
  const d = print("");
  for (let i = 0; i <= 18; i++) { d.textContent = `[${"█".repeat(i)}${"░".repeat(18 - i)}] ${Math.round(i / 18 * 100)}%`; await wait(50); }
  await wait(250); print("NamitOS shutting down..."); await wait(800);
  replay("off"); $("led").classList.add("off"); powered = false; pstate = "off"; busy = false;
  setTimeout(() => { if (pstate === "off") $("nosig").hidden = false; }, 2000);
}
async function restart() {
  if (pstate !== "off") return;
  pstate = "booting"; $("nosig").hidden = true; tone("click"); tone("whine");
  out.innerHTML = ""; $("led").classList.remove("off"); powered = true; replay();
  await boot(true);
  input.disabled = false; pstate = "on"; input.focus({ preventScroll: true });
}
$("power").addEventListener("click", () => pstate === "on" ? shutdown() : restart());
$("nosig").addEventListener("click", restart);
addEventListener("keydown", e => { if (pstate === "off" && !$("nosig").hidden) { e.preventDefault(); restart(); } });
document.querySelector(".keyboard").addEventListener("click", e => {
  if (e.target.closest("button")) return;
  $("snd").click(); print(`keyboard: clicky mode <span class="hot">${sound ? "ON" : "OFF"}</span>`, "dim");
});
document.querySelector(".bezel").addEventListener("click", e => { if (pstate === "on" && !e.target.closest("button, a, .sticky")) input.focus({ preventScroll: true }); });
const PHOS = ["amber", "green", "ice", "saffron"]; let pi = 0;
$("knob").addEventListener("click", e => {
  if (!powered) return;
  const list = found.has("gada") ? PHOS : PHOS.slice(0, 3);
  pi = (pi + 1) % list.length;
  e.currentTarget.style.setProperty("--rot", pi * 70 + "deg");
  COMMANDS["theme " + list[pi]]();
  tone("click");
});
document.querySelectorAll("[data-run]").forEach(o => o.addEventListener("click", () => {
  if (pstate === "off") { restart(); return; }
  if (pstate !== "on") return;
  if (matchMedia("(max-width: 860px)").matches) screen.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "center" });
  typeAndRun(o.dataset.run);
}));

/* boot: quick POST lines, then the summary and help, so the screen is complete at rest */
function intro() {
  print(`<div class="big">NAMIT TIWARI</div><span class="dim">computer science · quantum computing · New Delhi</span>`);
  neofetch();
  print(`<span class="dim">type</span> ${link("help")} <span class="dim">or try</span> ${link("ls")} · ${link("resume")} · ${link("contact")}`);
  screen.scrollTop = 0;
}
async function boot(bios) {
  const L = bios ? ["NAMIT BIOS (C) 1987–2029", "Memory test: 640K OK", "Loading NamitOS..."]
    : ["NT-BIOS v2.0 · POST", "memory check ........ 16384 MB ok", `mounting /projects .. ${Object.keys(PROJ).length} found`, "loading kernel ...... ok", "starting NamitOS"];
  for (const l of L) { print(l, bios ? "" : "dim"); await wait(bios ? 450 : 110); }
  if (bios) await wait(300);
  out.innerHTML = "";
  if (!bios) {
    if (!lastVisit) print(`<span class="dim">Welcome, visitor. Initializing NamitOS...</span>`);
    else print(`<span class="dim">Welcome back, visitor.
Last login: ${ago(lastVisit.last)} on tty1
Commands executed: ${lastVisit.cmds}${found.size ? `\nSecrets discovered: ${found.size}/${TOTAL}` : ""}</span>`);
  }
  intro();
}
if (store.get("nt-user", "namit") === "visitor") { Object.assign(sh, { user: "visitor", host: "namit" }); setPrompt(); }
boot(false);
